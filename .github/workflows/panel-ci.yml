# SPDX-License-Identifier: GPL-3.0-or-later
#
# 本组织新增的最小 CI（panel-starter-kit M0-02）：构建，以及只针对本组织新增文件的 SPDX 头检查（CONV-25）。
# UPSTREAM_BASE 是 node-agent 所用的上游提交（Xboard-Node 作者 fork 的提交，AGT-04）；
# 跟随上游或 rebase 后（core-upgrade Skill）同步更新。
name: panel-ci

on:
  push:
    branches: [panel-base]
  pull_request:
    branches: [panel-base, "m*/**"]

permissions:
  contents: read

env:
  UPSTREAM_BASE: 2e665cb7e295949ba7c5536f9b7754f94ab78cee

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -tags with_quic,with_utls,with_wireguard,with_acme,with_clash_api ./...

  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 .github/scripts/check_org_spdx.py "$UPSTREAM_BASE"
